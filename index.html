
<!DOCTYPE html>
<html lang="nl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rsolve - Conflicten oplossen zonder strijd</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.91.1"
  }
}
</script>
</head>
<body class="antialiased text-[#1e293b]">
    <!-- Verborgen formulier zodat Netlify Forms de inzendingen van "Juridische hulp" detecteert en opvangt -->
    <form name="lawyer-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="naam" />
      <input type="email" name="email" />
      <input type="tel" name="telefoon" />
      <input type="text" name="onderwerp" />
      <textarea name="bericht"></textarea>
    </form>
    <!-- Verborgen formulier voor de "stap verder"-flow: interne inbox met de GEANONIMISEERDE teaser -->
    <form name="stap-verder-aanvraag" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="naam" />
      <input type="email" name="email" />
      <input type="tel" name="telefoon" />
      <input type="text" name="route" />
      <input type="text" name="thema" />
      <input type="text" name="dossiernr" />
      <input type="text" name="case_ref" />
      <textarea name="anonieme_samenvatting"></textarea>
    </form>
    <!-- Verborgen formulier voor partneraanmeldingen (advocaten/juristen die willen adverteren) -->
    <form name="partner-aanmelding" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="kantoornaam" />
      <input type="text" name="contactpersoon" />
      <input type="email" name="email" />
      <input type="tel" name="telefoon" />
      <input type="text" name="rechtsgebieden" />
      <input type="text" name="regio" />
      <input type="text" name="website" />
      <textarea name="bericht"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
